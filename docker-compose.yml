# Floci, the local AWS emulator everything runs against, plus its web console.
# Started by `make floci` / `make up`; removed by `make down`.
name: fineprint

services:
  floci:
    image: floci/floci:2.1.0 # pinned; bump deliberately, not via :latest
    container_name: floci
    ports:
      - "4566:4566" # every AWS API; k3s API ports (6500-6599) are published by Floci itself
    volumes:
      # Floci starts sibling containers (k3s for EKS, the ECR registry) through the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Docker Desktop provides this name already; the mapping makes it work on Linux too.
      - "host.docker.internal:host-gateway"
    environment:
      # Name other containers use to reach Floci; appears in returned URLs (e.g. SQS QueueUrl).
      FLOCI_HOSTNAME: floci
      # memory = clean slate on every `make down`; nothing survives a restart.
      FLOCI_STORAGE_MODE: memory
      # Spawned containers (k3s, ECR registry) join this network so they can reach Floci.
      FLOCI_SERVICES_DOCKER_NETWORK: fineprint
      # Bedrock Runtime: forward Converse calls to Ollama on the host instead of the stub.
      FLOCI_SERVICES_BEDROCK_RUNTIME_BACKEND: proxy
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_URL: http://host.docker.internal:11434/v1
      # Any Bedrock modelId without an explicit mapping resolves to this Ollama model: the
      # derived model `make model` creates with a fixed context length, not the base model.
      FLOCI_SERVICES_BEDROCK_RUNTIME_PROXY_DEFAULT_MODEL: ${FINEPRINT_MODEL:-fineprint-qwen3.5}
      # Floci would otherwise launch the web console itself, outside this compose project.
      # The console is declared below instead, so it is versioned and cleaned up with the rest.
      FLOCI_SERVICES_UI_ENABLED: "false"
    networks:
      fineprint:
        # Fixed address so Kubernetes pods can still reach Floci by IP if the cluster's DNS
        # can't resolve the name "floci".
        ipv4_address: 172.28.0.10

  # Web console for browsing Floci's resources: http://localhost:4500
  floci-ui:
    image: floci/floci-ui:0.5.0 # pinned, like Floci
    container_name: floci-ui
    ports:
      - "4500:4500"
    environment:
      # The same settings Floci injects when it launches the console itself.
      PORT: "4500"
      FLOCI_CLOUD: aws
      FLOCI_HOSTNAME: floci
      FLOCI_ENDPOINT: http://floci:4566
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      floci:
        condition: service_healthy
    networks:
      - fineprint

networks:
  fineprint:
    name: fineprint
    ipam:
      config:
        - subnet: 172.28.0.0/16
